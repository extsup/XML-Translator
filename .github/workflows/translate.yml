name: Auto Translate strings.xml

on:
  push:
    paths:
      - 'input/strings.xml'   # Trigger hanya saat file ini berubah
  workflow_dispatch:          # Bisa dijalankan manual dari tab Actions
    inputs:
      target_lang:
        description: 'Kode bahasa tujuan (contoh: id, ja, ar, fr)'
        required: false
        default: 'id'

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run translation script
        run: |
          TARGET="${{ github.event.inputs.target_lang }}"
          TARGET="${TARGET:-id}"
          python translate.py --input input/strings.xml --output output/strings_${TARGET}.xml --lang ${TARGET}

      - name: Commit hasil terjemahan
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "🌐 Auto-translate: strings.xml → ${{ github.event.inputs.target_lang || 'id' }}"
          git push
