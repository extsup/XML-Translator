name: Auto Translate strings.xml

on:
  push:
    paths:
      - 'input/strings.xml'   # Trigger hanya saat file ini berubah
  workflow_dispatch:          # Bisa dijalankan manual dari tab Actions
    inputs:
      target_lang:
        description: 'Kode bahasa tujuan (contoh: id, ja, ar, fr, ko)'
        required: false
        default: 'id'

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run translation
        run: |
          TARGET="${{ github.event.inputs.target_lang }}"
          TARGET="${TARGET:-id}"
          mkdir -p result
          python translate.py \
            --input input/strings.xml \
            --output result/strings.xml \
            --lang $TARGET

      - name: Upload hasil sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: strings-translated
          path: result/strings.xml
          retention-days: 1
